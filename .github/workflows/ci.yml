name: CI

# Backend and frontend build + test on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels an in-flight run for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — mvn verify (Testcontainers)
    runs-on: ubuntu-latest
    # The runner has a working Docker daemon, which Testcontainers uses to spin
    # up MySQL and Redis for the integration tests.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        working-directory: parcel-flow-BE/parcel-flow-BE
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-failsafe-reports
          path: |
            parcel-flow-BE/parcel-flow-BE/target/surefire-reports
            parcel-flow-BE/parcel-flow-BE/target/failsafe-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend — lint, build, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: parcel-flow-fe/parcel-flow-fe/package-lock.json

      - name: Install dependencies
        working-directory: parcel-flow-fe/parcel-flow-fe
        run: npm ci

      - name: Lint
        working-directory: parcel-flow-fe/parcel-flow-fe
        run: npm run lint

      - name: Build
        working-directory: parcel-flow-fe/parcel-flow-fe
        run: npm run build

      - name: Install Playwright browsers
        working-directory: parcel-flow-fe/parcel-flow-fe
        run: npx playwright install --with-deps chromium

      # The E2E suite needs the whole stack. Bring it up with compose, wait for
      # the backend to report ready, then run the specs against it.
      - name: Start the stack
        run: |
          docker compose up -d --build
          echo "Waiting for the backend to become ready..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null 2>&1; then
              echo "Backend ready"; break
            fi
            sleep 5
          done
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/login >/dev/null 2>&1; then
              echo "Frontend ready"; break
            fi
            sleep 5
          done

      - name: Run Playwright E2E
        working-directory: parcel-flow-fe/parcel-flow-fe
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: parcel-flow-fe/parcel-flow-fe/playwright-report
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300
