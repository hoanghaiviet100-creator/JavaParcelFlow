# Parcel Flow — full stack, one command:
#   docker compose up -d
#
# Layout expected (both project folders side by side):
#   ./parcel-flow-BE   (Spring Boot backend, has Dockerfile)
#   ./parcel-flow-fe   (Next.js frontend, has Dockerfile)
#   ./docker-compose.yml   (this file)
#
# Brings up: MySQL, Redis, Kafka (KRaft), Mailhog (SMTP catcher), backend, frontend.

services:
  mysql:
    image: mysql:8.0
    container_name: pf-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: parcel_flow
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-padmin123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pf-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: pf-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Internal listener (for other containers) + host listener (for local tools).
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Local SMTP catcher: view emails (incl. temp passwords in dev) at http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: pf-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  backend:
    build:
      context: ./parcel-flow-BE/parcel-flow-BE
    container_name: pf-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/parcel_flow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: admin123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Mail: enabled, pointing at Mailhog (no auth) for local dev.
      MAIL_ENABLED: "true"
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      MAIL_FROM: no-reply@parcelflow.local
      # Security: OVERRIDE these in real deployments.
      JWT_SECRET: change-me-parcel-flow-super-secret-key-please-override-0123456789
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      BOOTSTRAP_ADMIN_ENABLED: "true"
      BOOTSTRAP_ADMIN_EMAIL: admin@parcelflow.local
      BOOTSTRAP_ADMIN_PASSWORD: Admin@12345
    ports:
      - "8080:8080"
    healthcheck:
      # Readiness (DB + Redis), not the full aggregate — mail must not gate it.
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./parcel-flow-fe/parcel-flow-fe
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    container_name: pf-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  mysql-data:
